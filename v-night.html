.scrim { position: fixed; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,.25) 0%, rgba(0,0,0,.68) 100%); }
.file { position: fixed; top: 30px; left: 34px; font-size: 11px; letter-spacing: .24em; opacity: .9; }
.file .no { color: #c2452d; font-weight: 700; }
.block { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); text-align: left; }
.block .who { font-size: 13px; letter-spacing: .3em; margin-bottom: 18px; opacity: .95; }
.field { display: flex; gap: 14px; align-items: baseline; margin: 9px 0; font-size: 13px; }
.field .k { font-size: 10px; letter-spacing: .2em; opacity: .55; }
.field .v { letter-spacing: .06em; }
.redact { background: #050505; color: transparent; user-select: none; padding: 1px 8px; }
